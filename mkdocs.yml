site_name: npcsh
site_url: https://npc-shell.readthedocs.io/
repo_url: https://github.com/NPC-Worldwide/npcsh
edit_uri: blob/main/docs/

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Skills: skills.md
  - Commands: commands.md
  - Agent Coders: agent-coders.md
